<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verlauf — Schiedsrichter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 960px;
      width: 100%;
      padding: 30px;
      margin-top: 20px;
      margin-bottom: 40px;
    }
    .back-link {
      display: inline-block;
      color: #667eea;
      text-decoration: none;
      font-size: 0.9em;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    h1 { color: #333; font-size: 1.6em; margin-bottom: 6px; }
    .page-subtitle { color: #666; font-size: 0.9em; margin-bottom: 28px; }

    /* ── Login ── */
    #login-section { text-align: center; padding: 40px 20px; }
    #login-section h2 { color: #333; margin-bottom: 24px; font-size: 1.3em; }
    .login-form { display: inline-flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
    .login-form label { font-size: 0.85em; font-weight: 600; color: #555; text-align: left; }
    .login-form input {
      padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 10px;
      font-size: 1em; font-family: inherit; transition: border-color 0.2s;
    }
    .login-form input:focus { outline: none; border-color: #667eea; }
    .login-btn {
      padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; border-radius: 10px; font-size: 1em;
      font-family: inherit; cursor: pointer; font-weight: 600; transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
    .error-msg { color: #dc3545; font-size: 0.9em; display: none; }
    .error-msg.visible { display: block; }

    /* ── Data ── */
    #data-section { display: none; }
    #data-section.visible { display: block; }

    /* ── Tabs ── */
    .tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 24px; }
    .tab-btn {
      padding: 10px 24px; border: none; background: none; font-size: 0.95em;
      font-family: inherit; color: #666; cursor: pointer;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: color 0.2s; font-weight: 500;
    }
    .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
    .tab-btn:hover { color: #667eea; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Stats cards ── */
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card {
      flex: 1; min-width: 110px;
      background: linear-gradient(135deg, #f5f3ff, #ede9fe);
      border-radius: 12px; padding: 14px 16px; text-align: center;
    }
    .stat-card .num { font-size: 1.8em; font-weight: 700; color: #667eea; }
    .stat-card .lbl { font-size: 0.8em; color: #666; margin-top: 2px; }

    /* ── Match table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    thead th {
      background: #f5f3ff; color: #5B2C6F; padding: 10px 12px;
      text-align: left; font-weight: 600; border-bottom: 2px solid #d4c5dc; white-space: nowrap;
    }
    tbody tr:nth-child(even) { background: #faf9ff; }
    tbody tr:hover { background: #f0edff; }
    tbody td { padding: 9px 12px; color: #333; border-bottom: 1px solid #eee; vertical-align: top; }

    /* ── Session cards (Quiz) ── */
    .session-card {
      border: 1px solid #e8e3f0; border-radius: 12px;
      margin-bottom: 16px; overflow: hidden;
    }
    .session-header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px 16px; cursor: pointer; user-select: none;
      background: #faf8ff; transition: background 0.2s;
    }
    .session-header:hover { background: #f0edff; }
    .session-toggle { color: #667eea; font-size: 0.85em; margin-left: auto; white-space: nowrap; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 0.8em; font-weight: 600;
    }
    .badge-basic { background: #e3f2fd; color: #1565c0; }
    .badge-advanced { background: #fce4ec; color: #880e4f; }
    .session-meta { font-size: 0.85em; color: #555; }
    .session-score {
      font-weight: 700; font-size: 1em;
    }
    .score-good { color: #28a745; }
    .score-mid  { color: #fd7e14; }
    .score-bad  { color: #dc3545; }
    .progress-mini {
      flex: 1; min-width: 120px; height: 8px;
      background: #e0e0e0; border-radius: 4px; overflow: hidden;
    }
    .progress-mini-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

    /* ── Answer list (inside session) ── */
    .answers-body { display: none; padding: 0 16px 16px; }
    .answers-body.open { display: block; }
    .answers-filter {
      display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 4px 12px; border-radius: 20px; border: 1px solid #e0e0e0;
      background: white; font-size: 0.8em; cursor: pointer; font-family: inherit;
      transition: background 0.2s, color 0.2s;
    }
    .filter-btn.active { background: #667eea; color: white; border-color: #667eea; }
    .answer-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid #f0eef8; font-size: 0.85em;
    }
    .answer-item:last-child { border-bottom: none; }
    .answer-icon { flex-shrink: 0; font-size: 1em; margin-top: 1px; }
    .answer-question { flex: 1; color: #333; line-height: 1.4; }
    .answer-question .q-meta { font-size: 0.8em; color: #aaa; margin-top: 2px; }
    .answer-given { font-size: 0.8em; color: #888; flex-shrink: 0; text-align: right; max-width: 180px; }
    .answer-given.wrong { color: #dc3545; }
    .answer-given.right { color: #28a745; }

    .empty-msg { text-align: center; color: #aaa; padding: 40px 20px; font-size: 0.95em; }
    .loading { text-align: center; color: #667eea; padding: 40px; font-size: 0.95em; }

    @media (max-width: 600px) {
      .container { padding: 20px 14px; }
      .tab-btn { padding: 8px 14px; font-size: 0.85em; }
      table { font-size: 0.8em; }
      thead th, tbody td { padding: 8px 8px; }
      .session-header { gap: 8px; }
    }
  </style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← Zurück zur Startseite</a>
  <h1>Verlauf &amp; Statistiken</h1>
  <p class="page-subtitle">Gespeicherte Spiele und Quizergebnisse</p>

  <!-- Login -->
  <div id="login-section">
    <h2>🔒 Zugang</h2>
    <div class="login-form">
      <label for="inp-user">Benutzername</label>
      <input type="text" id="inp-user" placeholder="Benutzername" autocomplete="username">
      <label for="inp-pwd">Passwort</label>
      <input type="password" id="inp-pwd" placeholder="Passwort" autocomplete="current-password">
      <button class="login-btn" onclick="doLogin()">Anmelden</button>
      <span class="error-msg" id="login-error">Falsches Passwort</span>
    </div>
  </div>

  <!-- Data -->
  <div id="data-section">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('quiz')">📝 Quiz-Sitzungen</button>
      <button class="tab-btn" onclick="switchTab('matches')">⚽ Spiele (Checkliste)</button>
    </div>

    <!-- Quiz Tab -->
    <div class="tab-panel active" id="tab-quiz">
      <div class="stats-row" id="quiz-stats-cards"></div>
      <div id="quiz-sessions-list"><div class="loading">Lädt…</div></div>
    </div>

    <!-- Matches Tab -->
    <div class="tab-panel" id="tab-matches">
      <div class="stats-row" id="match-stats-cards"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Datum</th><th>Anstoß</th><th>Heimverein</th><th>Gastverein</th>
              <th>Liga</th><th>Ort</th><th>Kategorie</th><th>Gespeichert</th>
            </tr>
          </thead>
          <tbody id="matches-tbody"><tr><td colspan="8" class="loading">Lädt…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let currentPwd = '';

  document.getElementById('inp-pwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function doLogin() {
    const user = document.getElementById('inp-user').value.trim();
    const pwd  = document.getElementById('inp-pwd').value;
    const errEl = document.getElementById('login-error');
    if (!user || !pwd) {
      errEl.textContent = 'Bitte alle Felder ausfüllen';
      errEl.classList.add('visible'); return;
    }
    errEl.classList.remove('visible');
    currentPwd = pwd;
    loadData();
  }

  async function loadData() {
    try {
      const res = await fetch(`/api/get-history?pwd=${encodeURIComponent(currentPwd)}`);
      if (res.status === 401) {
        const errEl = document.getElementById('login-error');
        errEl.textContent = 'Falsches Passwort';
        errEl.classList.add('visible'); return;
      }
      const data = await res.json();
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('data-section').classList.add('visible');
      renderQuizSessions(data.quizSessions || []);
      renderMatches(data.matches || []);
    } catch (err) {
      const errEl = document.getElementById('login-error');
      errEl.textContent = 'Verbindungsfehler: ' + err.message;
      errEl.classList.add('visible');
    }
  }

  /* ── Quiz sessions ── */
  function renderQuizSessions(sessions) {
    const cardsEl = document.getElementById('quiz-stats-cards');
    const listEl  = document.getElementById('quiz-sessions-list');

    if (!sessions.length) {
      cardsEl.innerHTML = '';
      listEl.innerHTML = '<div class="empty-msg">Noch keine Quizergebnisse gespeichert</div>';
      return;
    }

    const totalAnswered = sessions.reduce((s, x) => s + Number(x.total_answered), 0);
    const totalCorrect  = sessions.reduce((s, x) => s + Number(x.total_correct), 0);
    const avgPct = totalAnswered > 0 ? Math.round(totalCorrect / totalAnswered * 100) : 0;

    cardsEl.innerHTML = `
      <div class="stat-card"><div class="num">${sessions.length}</div><div class="lbl">Sitzungen</div></div>
      <div class="stat-card"><div class="num">${totalAnswered}</div><div class="lbl">Antworten gesamt</div></div>
      <div class="stat-card"><div class="num">${avgPct}%</div><div class="lbl">Ø Korrekt</div></div>
    `;

    listEl.innerHTML = sessions.map((s, idx) => {
      const answered = Number(s.total_answered);
      const correct  = Number(s.total_correct);
      const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
      const scoreClass = pct >= 80 ? 'score-good' : pct >= 60 ? 'score-mid' : 'score-bad';
      const fillColor  = pct >= 80 ? '#28a745' : pct >= 60 ? '#fd7e14' : '#dc3545';
      const courseLabel = s.course === 'advanced' ? 'Aufbaukurs' : 'Basiskurs';
      const courseBadge = s.course === 'advanced' ? 'badge-advanced' : 'badge-basic';
      const dateStr = fmtDateTime(s.last_answered_at);
      const answers = Array.isArray(s.answers) ? s.answers : [];

      return `
        <div class="session-card">
          <div class="session-header" onclick="toggleSession(${idx})">
            <span class="badge ${courseBadge}">${courseLabel}</span>
            <span class="session-meta">${dateStr} · Runde ${s.max_round}</span>
            <div class="progress-mini">
              <div class="progress-mini-fill" style="width:${pct}%;background:${fillColor}"></div>
            </div>
            <span class="session-score ${scoreClass}">${correct} / ${answered} (${pct}%)</span>
            <span class="session-toggle" id="toggle-label-${idx}">▶ Details</span>
          </div>
          <div class="answers-body" id="answers-body-${idx}">
            <div class="answers-filter">
              <button class="filter-btn active" onclick="filterAnswers(${idx},'all',this)">Alle (${answers.length})</button>
              <button class="filter-btn" onclick="filterAnswers(${idx},'wrong',this)">❌ Falsch (${answers.filter(a=>!a.is_correct).length})</button>
              <button class="filter-btn" onclick="filterAnswers(${idx},'right',this)">✅ Richtig (${answers.filter(a=>a.is_correct).length})</button>
            </div>
            <div id="answers-list-${idx}">
              ${renderAnswers(answers, 'all')}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderAnswers(answers, filter) {
    const filtered = filter === 'all' ? answers
      : filter === 'wrong' ? answers.filter(a => !a.is_correct)
      : answers.filter(a => a.is_correct);

    if (!filtered.length) return '<div class="empty-msg" style="padding:20px">Keine Einträge</div>';

    return filtered.map(a => {
      const icon = a.is_correct ? '✅' : '❌';
      const roundLabel = `Runde ${a.round}${a.phase === 'review' ? ' (Wdh.)' : ''}`;
      return `
        <div class="answer-item">
          <span class="answer-icon">${icon}</span>
          <div class="answer-question">
            ${esc(a.question_text)}
            <div class="q-meta">${roundLabel} · Frage #${a.question_id}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleSession(idx) {
    const body  = document.getElementById(`answers-body-${idx}`);
    const label = document.getElementById(`toggle-label-${idx}`);
    const isOpen = body.classList.toggle('open');
    label.textContent = isOpen ? '▼ Schließen' : '▶ Details';
  }

  function filterAnswers(idx, filter, btn) {
    const card = document.getElementById(`answers-body-${idx}`);
    card.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Find session answers
    const sessionCard = card.closest('.session-card');
    const sessionIdx  = [...document.querySelectorAll('.session-card')].indexOf(sessionCard);
    // Re-render from stored data
    const listEl = document.getElementById(`answers-list-${idx}`);
    if (!window._sessionData) return;
    const s = window._sessionData[idx];
    if (!s) return;
    listEl.innerHTML = renderAnswers(Array.isArray(s.answers) ? s.answers : [], filter);
  }

  /* ── Matches ── */
  function renderMatches(matches) {
    const cardsEl = document.getElementById('match-stats-cards');
    const tbody   = document.getElementById('matches-tbody');

    cardsEl.innerHTML = `
      <div class="stat-card"><div class="num">${matches.length}</div><div class="lbl">Spiele gesamt</div></div>
    `;

    if (!matches.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-msg">Noch keine Spiele gespeichert</td></tr>';
      return;
    }
    tbody.innerHTML = matches.map(m => `
      <tr>
        <td>${esc(m.datum)}</td>
        <td>${esc(m.anstoss ? String(m.anstoss).slice(0,5) : '—')}</td>
        <td><strong>${esc(m.heimverein)}</strong></td>
        <td><strong>${esc(m.gastverein)}</strong></td>
        <td>${esc(m.spielklasse)}</td>
        <td>${esc(m.spielort)}</td>
        <td>${esc(m.kategorie)}</td>
        <td style="color:#aaa;font-size:0.8em">${fmtDate(m.completed_at)}</td>
      </tr>
    `).join('');
  }

  /* ── Helpers ── */
  function esc(s) {
    return String(s || '—').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmtDate(str) {
    if (!str) return '—';
    try { return new Date(str).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' }); }
    catch { return str; }
  }
  function fmtDateTime(str) {
    if (!str) return '—';
    try {
      return new Date(str).toLocaleString('de-DE', {
        day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
      });
    } catch { return str; }
  }

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && name === 'quiz') || (i === 1 && name === 'matches'));
    });
    document.querySelectorAll('.tab-panel').forEach((p, i) => {
      p.classList.toggle('active', (i === 0 && name === 'quiz') || (i === 1 && name === 'matches'));
    });
  }

  // Store session data for filter function
  const origRenderQuizSessions = renderQuizSessions;
  function renderQuizSessions(sessions) {
    window._sessionData = sessions;
    origRenderQuizSessions(sessions);
  }
</script>
</body>
</html>
